version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: marketplace-postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: marketplace
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d marketplace"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:4.3.1
    container_name: marketplace-kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9093,CONTROLLER://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9094
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: marketplace-kafka-ui
    ports:
      - "8085:8085"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SERVER_PORT: 8085
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"

  catalog-migrate:
    build:
      context: .
      dockerfile: services/catalog/Dockerfile
    entrypoint: ["/app/migrate"]
    command: ["up"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://user:password@postgres/marketplace?sslmode=disable&search_path=catalog
    restart: "no"

  catalog-api:
    build:
      context: .
      dockerfile: services/catalog/Dockerfile
    environment:
      DATABASE_URL: postgres://user:password@postgres:5432/marketplace?sslmode=disable&search_path=catalog
    ports:
      - "8081:8081"
    depends_on:
      catalog-migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy

  catalog-relay:
    build:
      context: .
      dockerfile: services/catalog/Dockerfile
    entrypoint: ["/app/relay"]
    environment:
      DATABASE_URL: postgres://user:password@postgres:5432/marketplace?sslmode=disable&search_path=catalog
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: catalog.events

    depends_on:
      catalog-migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
volumes:
  pgdata:
  kafka-data:
